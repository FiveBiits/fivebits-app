services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fivebits-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fivebits-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./fivebits-backend
      dockerfile: Dockerfile
    container_name: fivebits-backend
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SERVER_PORT: 8080
      JWT_SECRET: FiveBitsSecretKeyForJWTTokenGeneration2026
      JWT_EXPIRATION: 86400000
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fivebits-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./fivebits-frontend
      dockerfile: Dockerfile
    container_name: fivebits-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fivebits-network
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:

networks:
  fivebits-network:
    driver: bridge
