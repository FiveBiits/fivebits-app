services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: fivebits-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 64820
      POSTGRES_DB: commentsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fivebits-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Spring Boot Backend
  backend:
    build:
      context: ./fivebits-backend
      dockerfile: Dockerfile
    container_name: fivebits-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/commentsdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 64820
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fivebits-network
    restart: unless-stopped

  # React Frontend
  frontend:
    build:
      context: ./fivebits-frontend
      dockerfile: Dockerfile
    container_name: fivebits-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fivebits-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  fivebits-network:
    driver: bridge
