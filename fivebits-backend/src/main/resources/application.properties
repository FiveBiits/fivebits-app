# ===========================
# DATABASE CONNECTION
# ===========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# ===========================
# JPA / HIBERNATE SETTINGS
# ===========================
# "update" means Spring will auto-create/update tables based on your Java classes
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Print SQL queries to the console (useful for learning/debugging)
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Tell Hibernate we're using PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===========================
# SERVER
# ===========================
server.port=${SERVER_PORT:8080}

# ===========================
# UNIVERSITY FIXED LOCATION (for distance calculation)
# ===========================
app.university.latitude=6.795857210496248
app.university.longitude=79.90232121476035
# ===========================
# GOOGLE MAPS (Distance Matrix API)
# ===========================
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}