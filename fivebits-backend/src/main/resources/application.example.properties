# ===========================
# DATABASE CONNECTION
# ===========================
# Configure your PostgreSQL database connection here
spring.datasource.url=jdbc:postgresql://localhost:5432/commentsdb
spring.datasource.username=postgres
spring.datasource.password=YOUR_PASSWORD_HERE

# ===========================
# JPA / HIBERNATE SETTINGS
# ===========================
# "update" means Spring will auto-create/update tables based on your Java classes
spring.jpa.hibernate.ddl-auto=update

# Print SQL queries to the console (useful for learning/debugging)
spring.jpa.show-sql=true

# Tell Hibernate we're using PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===========================
# SERVER
# ===========================
server.port=8080
